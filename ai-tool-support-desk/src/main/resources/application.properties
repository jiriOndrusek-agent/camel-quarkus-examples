quarkus.banner.enabled=false

# The chat model of the customer support agent: granite4.1:3b served by Ollama on your machine, through the OpenAI
# compatible API of Ollama. To use another OpenAI compatible API, set the SUPPORT_DESK_LLM_BASE_URL,
# SUPPORT_DESK_LLM_MODEL and SUPPORT_DESK_LLM_API_KEY environment variables.
support-desk.llm.base-url=http://localhost:11434/v1
support-desk.llm.model=granite4.1:3b
# Ollama ignores the API key, but the OpenAI client needs one
support-desk.llm.api-key=ollama
# A small model on a laptop CPU may need a few minutes to answer
support-desk.llm.timeout=3m

# PostgreSQL holds the orders, returns, tickets and the tool audit. In dev and test mode, Dev Services start it, create
# the tables with db/schema.sql and load the demo data of db/demo-data.sql. Otherwise set QUARKUS_DATASOURCE_JDBC_URL,
# QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD, and create the tables with db/schema.sql.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.init-script-path=db/schema.sql,db/demo-data.sql

# The carrier API. In dev mode, the stand-in of StandInRoutes serves it, so that the example runs without an account.
# Otherwise set SUPPORT_DESK_CARRIER_URL.
%dev.support-desk.carrier.url=http://localhost:${quarkus.http.port}/fake/carrier
# The circuit breaker of track_shipment handles a failing carrier call, the HTTP client does not retry it
camel.component.http.automatic-retries-disabled=true

# The MCP server for the support staff publishes the ai-tool routes tagged "support" at /mcp
quarkus.camel.mcp-server.tags=support
quarkus.mcp.server.server-info.name=support-desk
# The MCP server wants the CORS filter, for MCP clients running in a browser: allow their origins with
# quarkus.http.cors.origins
quarkus.http.cors.enabled=true

# HTTP basic authentication. Only the support staff may use the MCP server.
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=support-staff
quarkus.http.auth.policy.support-staff.roles-allowed=support
# Demo users for dev mode, whose password is their user name. Customers need the verified role to request returns or
# open tickets: dave has not verified their account. Outside dev mode, configure your users, or better a real identity
# provider such as OpenID Connect.
%dev.quarkus.security.users.embedded.plain-text=true
%dev.quarkus.security.users.embedded.users.alice=alice
%dev.quarkus.security.users.embedded.roles.alice=customer,verified
%dev.quarkus.security.users.embedded.users.bob=bob
%dev.quarkus.security.users.embedded.roles.bob=customer,verified
%dev.quarkus.security.users.embedded.users.carol=carol
%dev.quarkus.security.users.embedded.roles.carol=support
%dev.quarkus.security.users.embedded.users.dave=dave
%dev.quarkus.security.users.embedded.roles.dave=customer

# The prompt, the tool schema and the SQL statements are loaded from the classpath, so they must be embedded into the
# native executable
quarkus.native.resources.includes=prompts/*.txt,schemas/*.json,sql/*.sql
