# Stand-ins for the external systems of the shop, so that the example runs without accounts. They are only loaded in
# dev mode (camel.main.routes-include-pattern in application.properties): elsewhere, point support-desk.carrier.url and
# support-desk.payment.url at the real APIs, and let the ticketing system of the support team consume tickets.escalated.

# The carrier API
- route:
    id: fake-carrier
    from:
      uri: platform-http:/fake/carrier/shipments/{trackingNumber}
      parameters:
        httpMethodRestrict: GET
        produces: application/json
      steps:
        - setBody:
            expression:
              simple:
                expression: '{"trackingNumber": "${header.trackingNumber}", "status": "IN_TRANSIT", "estimatedDelivery": "${date:now+48h:yyyy-MM-dd}"}'

# The payment provider API
- route:
    id: fake-payments
    from:
      uri: platform-http:/fake/payments/refunds
      parameters:
        httpMethodRestrict: POST
        produces: application/json
      steps:
        - log:
            message: "Refund ${header.Idempotency-Key} accepted: ${body}"
        - setBody:
            expression:
              simple:
                expression: '{"refundId": "${uuid}", "status": "ACCEPTED"}'

# The ticketing system of the support team, which learns about the tickets opened by escalate_to_human
- route:
    id: fake-ticketing
    from:
      uri: kafka:tickets.escalated
      parameters:
        groupId: support-team
        autoOffsetReset: earliest
      steps:
        - log:
            message: "New ticket for the support team: ${body}"
