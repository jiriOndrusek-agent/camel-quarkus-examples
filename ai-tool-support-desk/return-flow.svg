<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 846" width="900" height="846" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12">
  <title>AI tool support desk: return flow</title>
  <style>
    text { fill: #1f2937; }
    .h { font-size: 14px; font-weight: bold; }
    .n { font-size: 13px; font-weight: bold; }
    .b { font-weight: bold; }
    .m { font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
    .s { fill: #4b5563; }
    .i { fill: #4b5563; font-style: italic; }
    .cb { fill: #1e40af; }
    .cv { fill: #5b21b6; }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="900" height="846" fill="#ffffff"/>
  <!-- Participants -->
  <circle cx="44" cy="28" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <path d="M27,60 a17,17 0 0 1 34,0" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="44" y="76" text-anchor="middle" class="n">Customer</text>
  <rect x="120" y="16" width="144" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="192" y="35" text-anchor="middle" class="n">ChatResource</text>
  <text x="192" y="52" text-anchor="middle"><tspan>route</tspan> <tspan class="m">chat</tspan></text>
  <text x="192" y="69" text-anchor="middle" class="m">langchain4j-agent</text>
  <rect x="290" y="16" width="100" height="64" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="44" text-anchor="middle" class="n">LLM</text>
  <text x="340" y="61" text-anchor="middle" class="s">picks the tool</text>
  <rect x="424" y="16" width="176" height="64" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <path d="M438.5,27 v-2.5 a2.5,2.5 0 0 1 5,0 v2.5" fill="none" stroke="#1e40af" stroke-width="1.4"/>
  <rect x="436" y="27" width="10" height="8" rx="1.5" fill="#1e40af"/>
  <text x="452" y="34" class="b cb">VerifiedCustomerPolicy</text>
  <rect x="436" y="42" width="152" height="28" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>
  <text x="512" y="61" text-anchor="middle" class="m n">request_return</text>
  <path d="M626,25 a50.0,7 0 0 1 100,0 v46 a50.0,7 0 0 1 -100,0 z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <path d="M626,25 a50.0,7 0 0 0 100,0" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="676" y="58" text-anchor="middle" class="n">PostgreSQL</text>
  <circle cx="840" cy="28" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="2.2"/>
  <path d="M823,60 a17,17 0 0 1 34,0" fill="#ffffff" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="840" y="76" text-anchor="middle" class="n">Support staff</text>
  <text x="840" y="92" text-anchor="middle" class="s">over MCP</text>

  <!-- Lifelines -->
  <path d="M44,84 V774" fill="none" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="4 4"/>
  <path d="M192,84 V774" fill="none" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="4 4"/>
  <path d="M340,84 V774" fill="none" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="4 4"/>
  <path d="M512,84 V774" fill="none" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="4 4"/>
  <path d="M676,84 V774" fill="none" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="4 4"/>
  <path d="M840,98 V774" fill="none" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="4 4"/>

  <!-- alt: VerifiedCustomerPolicy -->
  <rect x="152" y="224" width="634" height="360" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.25"/>
  <path d="M152,228 a4,4 0 0 1 4,-4 H186 V236 l-6,7 H152 z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="159" y="238" class="b s">alt</text>
  <text x="194" y="238" class="b">[not verified]</text>
  <path d="M152,290 H786" fill="none" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="160" y="305" class="b">[verified]</text>

  <!-- alt: amount -->
  <rect x="360" y="412" width="412" height="128" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.25"/>
  <path d="M360,416 a4,4 0 0 1 4,-4 H394 V424 l-6,7 H360 z" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="367" y="426" class="b s">alt</text>
  <text x="402" y="426" class="b">[≤ 50 EUR]</text>
  <path d="M360,476 H772" fill="none" stroke="#94a3b8" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="368" y="491" class="b">[&gt; 50 EUR]</text>

  <!-- The route runs -->
  <rect x="507" y="296" width="10" height="280" rx="2" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>

  <!-- The customer asks for a return -->
  <text x="118" y="103" text-anchor="middle" class="m">POST /support/chat</text>
  <path d="M44,110 H190" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="266" y="133" text-anchor="middle">prompt, memory, tools</text>
  <path d="M192,140 H338" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="266" y="163" text-anchor="middle"><tspan>call</tspan> <tspan class="m">request_return</tspan></text>
  <path d="M340,170 H194" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <rect x="304" y="184" width="49" height="15" fill="#ffffff"/>
  <text x="329" y="195" text-anchor="middle">tool call</text>
  <path d="M192,202 H464" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect x="466" y="189" width="92" height="26" rx="6" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <path d="M480.5,199 v-2.5 a2.5,2.5 0 0 1 5,0 v2.5" fill="none" stroke="#1e40af" stroke-width="1.4"/>
  <rect x="478" y="199" width="10" height="8" rx="1.5" fill="#1e40af"/>
  <text x="494" y="206" class="b cb">verified?</text>

  <!-- Not verified: the route does not run -->
  <rect x="309" y="242" width="87" height="15" fill="#ffffff"/>
  <text x="352" y="253" text-anchor="middle">not authorized</text>
  <rect x="246" y="265" width="212" height="15" fill="#ffffff"/>
  <text x="352" y="276" text-anchor="middle"><tspan class="s">the route does not run, audit</tspan> <tspan class="m">DENIED</tspan></text>
  <path d="M512,260 H194" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ab)"/>

  <!-- Verified: the route runs and checks the return rules -->
  <rect x="524" y="296" width="118" height="22" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="532" y="311">valid reason code?</text>
  <text x="596.5" y="337" text-anchor="middle" class="m">check-return.sql</text>
  <path d="M517,344 H674" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect x="360" y="356" width="412" height="44" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="370" y="375">An order of the customer, delivered ≤ 30 days ago, with these items?</text>
  <text x="370" y="392">If not, or for an invalid reason code, the model is told why.</text>
  <text x="596.5" y="443" text-anchor="middle" class="m">insert-return.sql</text>
  <text x="596.5" y="466" text-anchor="middle" class="m b">APPROVED</text>
  <path d="M517,450 H674" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="596.5" y="507" text-anchor="middle" class="m">insert-return.sql</text>
  <text x="596.5" y="530" text-anchor="middle" class="m b">PENDING_APPROVAL</text>
  <path d="M517,514 H674" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <rect x="227" y="552" width="246" height="15" fill="#ffffff"/>
  <text x="349.5" y="563" text-anchor="middle">Return N approved, or waiting for approval</text>
  <path d="M507,570 H194" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ab)"/>

  <!-- The reply -->
  <text x="266" y="607" text-anchor="middle">tool result</text>
  <path d="M192,614 H338" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="266" y="637" text-anchor="middle">answer</text>
  <path d="M340,644 H194" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="118" y="667" text-anchor="middle">200, reply</text>
  <path d="M192,674 H46" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#ab)"/>

  <!-- Later, the support staff decide -->
  <text x="758" y="703" text-anchor="middle" class="m">list_pending_returns</text>
  <path d="M840,710 H678" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/>
  <text x="758" y="737" text-anchor="middle" class="m">decide_return</text>
  <text x="758" y="760" text-anchor="middle"><tspan class="m b">APPROVED</tspan> <tspan class="s">or</tspan> <tspan class="m b">REJECTED</tspan></text>
  <path d="M840,744 H678" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/>

  <!-- Escalation -->
  <rect x="16" y="786" width="868" height="46" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="28" y="805"><tspan class="b">Escalation:</tspan> <tspan></tspan> <tspan class="m">escalate_to_human</tspan> <tspan>runs behind the same policy and stores a ticket with status</tspan> <tspan class="m">OPEN</tspan><tspan>.</tspan></text>
  <text x="28" y="823" class="s">Handing approved returns and open tickets over to other systems is out of scope.</text>
</svg>
