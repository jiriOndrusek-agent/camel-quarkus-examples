<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 724" width="900" height="724" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="12">
  <title>AI tool support desk: components</title>
  <style>
    text { fill: #1f2937; }
    .h { font-size: 14px; font-weight: bold; }
    .n { font-size: 13px; font-weight: bold; }
    .b { font-weight: bold; }
    .m { font-family: Menlo, Consolas, 'Liberation Mono', monospace; }
    .s { fill: #4b5563; }
    .i { fill: #4b5563; font-style: italic; }
    .cb { fill: #1e40af; }
    .cv { fill: #5b21b6; }
    .a { font-size: 15px; font-weight: bold; }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="724" fill="#ffffff"/>
  <!-- Actors -->
  <circle cx="417" cy="22" r="9" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <path d="M400,54 a17,17 0 0 1 34,0" fill="#ffffff" stroke="#2563eb" stroke-width="2.2"/>
  <text x="393" y="27" text-anchor="end" class="a">Customer</text>
  <text x="393" y="44" text-anchor="end" class="s">role customer</text>
  <rect x="225" y="52" width="168" height="19" rx="9.5" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="233" y="65" class="i">dev mode: alice, bob, dave</text>
  <circle cx="725" cy="22" r="9" fill="#ffffff" stroke="#7c3aed" stroke-width="2.2"/>
  <path d="M708,54 a17,17 0 0 1 34,0" fill="#ffffff" stroke="#7c3aed" stroke-width="2.2"/>
  <text x="749" y="27" class="a">Support staff</text>
  <text x="749" y="44" class="s">role support</text>
  <rect x="749" y="52" width="106.5" height="19" rx="9.5" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="757" y="65" class="i">dev mode: carol</text>

  <!-- Quarkus application -->
  <rect x="220" y="96" width="664" height="520" rx="12" fill="#fbfcfd" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="234" y="118" class="h">Quarkus application</text>
  <rect x="246" y="132" width="342" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="258" y="153" class="h">ChatResource</text>
  <text x="258" y="171"><tspan class="m">POST /support/chat</tspan> <tspan class="s" dx="7">HTTP 400 · 429 · 502</tspan></text>
  <text x="258" y="188"><tspan class="s">sets</tspan> <tspan class="m">customerId</tspan><tspan class="s">,</tspan> <tspan class="m">customerVerified</tspan> <tspan class="s">from the login</tspan></text>
  <rect x="604" y="132" width="112" height="66" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="616" y="153" class="h">MCP server</text>
  <text x="616" y="171" class="m">/mcp</text>
  <rect x="724" y="132" width="134" height="66" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="736" y="153" class="h">AdminResource</text>
  <text x="736" y="171" class="m">/admin</text>
  <text x="736" y="188" class="s">kill switch, audit</text>
  <rect x="246" y="222" width="342" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="258" y="241"><tspan class="h">route</tspan> <tspan class="m n">chat</tspan></text>
  <text x="258" y="259" class="s">throttle: 1 message per customer</text>
  <rect x="246" y="292" width="342" height="46" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="258" y="311" class="m n">langchain4j-agent</text>
  <text x="258" y="329" class="s">max 5 tool calling rounds per message</text>

  <!-- ai-tool routes: the route id is the tool name -->
  <rect x="234" y="366" width="636" height="236" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="246" y="387" class="h">ai-tool routes</text>
  <text x="425" y="387" class="m cb">tags=customer</text>
  <text x="668" y="387" class="m cv">tags=support</text>
  <text x="858" y="387" text-anchor="end" class="m s">ToolRoutes</text>
  <rect x="246" y="398" width="342" height="148" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="260" y="408" width="153" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>
  <text x="336.5" y="424" text-anchor="middle" class="m n">track_shipment</text>
  <text x="336.5" y="440" text-anchor="middle" class="s">circuit breaker</text>
  <rect x="421" y="408" width="153" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>
  <text x="497.5" y="424" text-anchor="middle" class="m n">get_order</text>
  <text x="497.5" y="440" text-anchor="middle" class="s">order and its items</text>
  <rect x="252" y="458" width="330" height="76" rx="8" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/>
  <path d="M264.5,468 v-2.5 a2.5,2.5 0 0 1 5,0 v2.5" fill="none" stroke="#1e40af" stroke-width="1.4"/>
  <rect x="262" y="468" width="10" height="8" rx="1.5" fill="#1e40af"/>
  <text x="278" y="475"><tspan class="b cb">VerifiedCustomerPolicy</tspan> <tspan class="s" dx="7">verified customers only</tspan></text>
  <rect x="260" y="484" width="153" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>
  <text x="336.5" y="500" text-anchor="middle" class="m n">request_return</text>
  <text x="336.5" y="516" text-anchor="middle" class="s">approves ≤ 50 EUR</text>
  <rect x="421" y="484" width="153" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.25"/>
  <text x="497.5" y="500" text-anchor="middle" class="m n">escalate_to_human</text>
  <text x="497.5" y="516" text-anchor="middle" class="s">opens a ticket</text>
  <rect x="604" y="398" width="254" height="148" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1"/>
  <rect x="618" y="408" width="226" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.25"/>
  <text x="731" y="424" text-anchor="middle" class="m n">list_pending_returns</text>
  <text x="731" y="440" text-anchor="middle" class="s">returns waiting for approval</text>
  <rect x="618" y="484" width="226" height="40" rx="6" fill="#ffffff" stroke="#7c3aed" stroke-width="1.25"/>
  <text x="731" y="500" text-anchor="middle" class="m n">decide_return</text>
  <text x="731" y="516" text-anchor="middle" class="s">approve or reject a return</text>
  <rect x="246" y="558" width="612" height="32" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.25"/>
  <text x="552" y="578" text-anchor="middle"><tspan class="n">ToolAudit</tspan> <tspan class="s" dx="7">every tool call →</tspan> <tspan class="m">tool_audit</tspan><tspan class="s">:</tspan> <tspan class="m" dx="3.5">OK</tspan> <tspan class="s">·</tspan> <tspan class="m">FAILED</tspan> <tspan class="s">·</tspan> <tspan class="m">DENIED</tspan> <tspan class="s">by the policy</tspan></text>

  <!-- External systems -->
  <rect x="16" y="277" width="136" height="76" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="26" y="296" class="h">LLM</text>
  <text x="26" y="313" class="s">Ollama granite4.1:3b</text>
  <text x="26" y="329" class="s">or any OpenAI</text>
  <text x="26" y="345" class="s">compatible API</text>
  <rect x="16" y="402" width="136" height="52" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="26" y="423" class="h">Carrier API</text>
  <text x="26" y="441" class="s">shipment tracking</text>
  <path d="M292,655 a260.0,7 0 0 1 520,0 v46 a260.0,7 0 0 1 -520,0 z" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <path d="M292,655 a260.0,7 0 0 0 520,0" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <text x="552" y="682" text-anchor="middle" class="h">PostgreSQL</text>
  <text x="552" y="699" text-anchor="middle" class="m s">customers · orders · order_items · returns · tickets · tool_audit</text>

  <!-- Dev mode stand-ins -->
  <rect x="16" y="470" width="136" height="64" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="26" y="487" class="i">dev mode stand-in</text>
  <text x="26" y="505" class="m n">fake-carrier</text>
  <text x="26" y="522" class="s">StandInRoutes</text>
  <path d="M84,454 V470" fill="none" stroke="#64748b" stroke-width="1.25" stroke-dasharray="2 3"/>
  <rect x="16" y="648" width="136" height="60" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="26" y="666" class="i">dev mode stand-in</text>
  <text x="26" y="684" class="b">Dev Services</text>
  <text x="26" y="701" class="m s">db/demo-data.sql</text>
  <path d="M152,678 H292" fill="none" stroke="#64748b" stroke-width="1.25" stroke-dasharray="2 3"/>

  <!-- Legend -->
  <rect x="16" y="136" width="20" height="13" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
  <text x="44" y="146" class="s">customer side</text>
  <rect x="16" y="156" width="20" height="13" rx="3" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.25"/>
  <text x="44" y="166" class="s">support staff side</text>
  <rect x="16" y="176" width="20" height="13" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.25"/>
  <text x="44" y="186" class="s">infrastructure</text>
  <rect x="16" y="196" width="20" height="13" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.25" stroke-dasharray="4 3"/>
  <text x="44" y="206" class="s">dev mode only</text>

  <!-- Customer flow -->
  <path d="M417,62 V131" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="425" y="118" class="s">HTTP</text>
  <path d="M417,198 V221" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <path d="M417,268 V291" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>
  <path d="M417,338 V397" fill="none" stroke="#2563eb" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- Support staff flows -->
  <path d="M725,62 V80 M660,80 H791" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <path d="M660,80 V131" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/>
  <path d="M791,80 V131" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/>
  <text x="668" y="118" class="s">AI assistant, MCP</text>
  <text x="799" y="118" class="s">HTTP</text>
  <path d="M660,198 V397" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#av)"/>
  <path d="M791,198 V365" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#av)"/>
  <text x="783" y="306" text-anchor="end" class="s">stop / start</text>
  <text x="783" y="322" text-anchor="end" class="s">tool routes</text>

  <!-- Infrastructure -->
  <path d="M245,315 H153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ag)" marker-start="url(#ag)"/>
  <text x="186" y="308" text-anchor="middle" class="s">messages,</text>
  <text x="186" y="331" text-anchor="middle" class="s">tool calls</text>
  <path d="M260,428 H153" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="186" y="421" text-anchor="middle" class="s">HTTP</text>
  <path d="M417,602 V649" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="425" y="636" class="s">SQL</text>
  <path d="M731,602 V649" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="739" y="636" class="s">SQL</text>
</svg>
