<svg xmlns="http://www.w3.org/2000/svg" width="800" height="690" viewBox="0 0 800 690" role="img" aria-labelledby="title desc">
  <title id="title">POST /api/orders: the checks, in order</title>
  <desc id="desc">Sequence diagram. A partner sends POST /api/orders. Quarkus checks the token, the role, the body size and the media types. The Camel route takes the tenant from the token, checks the content type, throttles per partner, validates the key and the order and runs the idempotent consumer. OrderService stores the order and AuditLog appends a record in the same transaction. A failed check is answered with problem+json and audited.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; fill: #1f2328; }
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .box { fill: #f6f8fa; stroke: #8c959f; }
    .note { fill: #ffffff; stroke: #8c959f; }
    .life { stroke: #8c959f; stroke-dasharray: 4 4; fill: none; }
    .sep { stroke: #d0d7de; fill: none; }
    .ttl { font-size: 15px; font-weight: 600; }
    .b { font-weight: 600; }
    .s { font-size: 10.5px; }
    .m { fill: #59636e; }
    .e { text-anchor: end; }
    .mid { text-anchor: middle; }
    .ok { stroke: #0969da; stroke-width: 1.5; fill: none; }
    .err { stroke: #cf222e; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .aud { stroke: #8250df; stroke-width: 1.5; fill: none; }
    .ret { stroke: #0969da; stroke-width: 1.5; stroke-dasharray: 6 4; fill: none; }
    .mk-ok { fill: #0969da; }
    .mk-err { fill: #cf222e; }
    .mk-aud { fill: #8250df; }
    .num { fill: #0969da; }
    .numt { fill: #ffffff; font-size: 10px; font-weight: 600; text-anchor: middle; }
    text.code { fill: #cf222e; font-weight: 600; text-anchor: end; }
    text.audit { fill: #8250df; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .bg { fill: #0d1117; stroke: #30363d; }
      .box { fill: #161b22; stroke: #6e7681; }
      .note { fill: #0d1117; stroke: #6e7681; }
      .life { stroke: #6e7681; }
      .sep { stroke: #30363d; }
      .m { fill: #9198a1; }
      .ok, .ret { stroke: #4493f8; }
      .err { stroke: #ff7b72; }
      .aud { stroke: #bc8cff; }
      .mk-ok { fill: #4493f8; }
      .mk-err { fill: #ff7b72; }
      .mk-aud { fill: #bc8cff; }
      .num { fill: #4493f8; }
      .numt { fill: #0d1117; }
      text.code { fill: #ff7b72; }
      text.audit { fill: #bc8cff; }
    }
  </style>
  <defs>
    <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="mk-ok" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-err" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="mk-err" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ah-aud" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto"><path class="mk-aud" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="799" height="689" rx="8"/>
  <text class="ttl" x="14" y="23">POST /api/orders: the checks, in order</text>

  <!-- lifelines -->
  <line class="life" x1="70" y1="76" x2="70" y2="650"/>
  <line class="life" x1="235" y1="76" x2="235" y2="650"/>
  <line class="life" x1="408" y1="76" x2="408" y2="650"/>
  <line class="life" x1="585" y1="76" x2="585" y2="650"/>
  <line class="life" x1="735" y1="76" x2="735" y2="650"/>

  <!-- participants -->
  <rect class="box" x="12" y="34" width="116" height="42" rx="6"/>
  <text class="b mid" x="70" y="52">Partner</text>
  <text class="m s mid" x="70" y="67">client + token</text>
  <rect class="box" x="177" y="34" width="116" height="42" rx="6"/>
  <text class="b mid" x="235" y="52">Quarkus</text>
  <text class="m s mid" x="235" y="67">HTTP, OIDC, RBAC</text>
  <rect class="box" x="350" y="34" width="116" height="42" rx="6"/>
  <text class="b mid" x="408" y="52">Camel route</text>
  <text class="m s mid" x="408" y="67">order-create</text>
  <rect class="box" x="527" y="34" width="116" height="42" rx="6"/>
  <text class="b mid" x="585" y="52">OrderService</text>
  <text class="m s mid" x="585" y="67">JPA</text>
  <rect class="box" x="677" y="34" width="116" height="42" rx="6"/>
  <text class="b mid" x="735" y="52">AuditLog</text>
  <text class="m s mid" x="735" y="67">PostgreSQL</text>

  <!-- 1: request -->
  <line class="ok" x1="70" y1="106" x2="233" y2="106" marker-end="url(#ah-ok)"/>
  <circle class="num" cx="84" cy="95" r="8.5"/><text class="numt" x="84" y="98.5">1</text>
  <text x="98" y="99">POST /api/orders</text>

  <!-- 2-4: Quarkus checks -->
  <rect class="note" x="118" y="124" width="234" height="94" rx="6"/>
  <circle class="num" cx="134" cy="142" r="8.5"/><text class="numt" x="134" y="145.5">2</text>
  <text x="150" y="146">Token valid?</text>
  <text class="code" x="344" y="146">401</text>
  <circle class="num" cx="134" cy="162" r="8.5"/><text class="numt" x="134" y="165.5">3</text>
  <text x="150" y="166">Role partner? (deny-all)</text>
  <text class="code" x="344" y="166">403</text>
  <circle class="num" cx="134" cy="182" r="8.5"/><text class="numt" x="134" y="185.5">4</text>
  <text x="150" y="186">Size, media types</text>
  <text class="code" x="344" y="186">413 415 406</text>
  <text class="m s" x="128" y="207">Plain answers. 4 is not audited.</text>

  <!-- 401/403 are audited by SecurityEventAuditor -->
  <line class="aud" x1="352" y1="156" x2="733" y2="156" marker-end="url(#ah-aud)"/>
  <text class="audit s" x="542" y="149" text-anchor="middle">AUTHN_FAILED, AUTHZ_DENIED</text>
  <text class="m s" x="542" y="171" text-anchor="middle">for 2 and 3, written asynchronously</text>

  <!-- to the route -->
  <line class="ok" x1="235" y1="240" x2="406" y2="240" marker-end="url(#ah-ok)"/>
  <text class="m s" x="246" y="233">direct:order-create</text>

  <!-- 5-9: Camel checks -->
  <rect class="note" x="288" y="254" width="240" height="108" rx="6"/>
  <circle class="num" cx="304" cy="272" r="8.5"/><text class="numt" x="304" y="275.5">5</text>
  <text x="320" y="276">Tenant: partner_id claim</text>
  <text class="code" x="520" y="276">403</text>
  <circle class="num" cx="304" cy="292" r="8.5"/><text class="numt" x="304" y="295.5">6</text>
  <text x="320" y="296">Content-Type, drop headers</text>
  <text class="code" x="520" y="296">415</text>
  <circle class="num" cx="304" cy="312" r="8.5"/><text class="numt" x="304" y="315.5">7</text>
  <text x="320" y="316">Throttle per partner</text>
  <text class="code" x="520" y="316">429</text>
  <circle class="num" cx="304" cy="332" r="8.5"/><text class="numt" x="304" y="335.5">8</text>
  <text x="320" y="336">Key format, JSON schema</text>
  <text class="code" x="520" y="336">400</text>
  <circle class="num" cx="304" cy="352" r="8.5"/><text class="numt" x="304" y="355.5">9</text>
  <text x="320" y="356">Idempotent consumer</text>
  <text class="code" x="520" y="356">409</text>

  <!-- 10: accept -->
  <line class="ok" x1="408" y1="394" x2="583" y2="394" marker-end="url(#ah-ok)"/>
  <circle class="num" cx="424" cy="383" r="9"/><text class="numt" x="424" y="386.5">10</text>
  <text x="440" y="387">accept (new key)</text>
  <text class="m s" x="416" y="410">known key: replay, 200</text>

  <!-- audit append -->
  <line class="aud" x1="585" y1="436" x2="733" y2="436" marker-end="url(#ah-aud)"/>
  <text class="audit s" x="592" y="429">ORDER_ACCEPTED</text>
  <text class="m s" x="592" y="451">same transaction</text>
  <rect class="note" x="667" y="462" width="128" height="42" rx="6"/>
  <text class="s mid" x="731" y="478">lock chain head row,</text>
  <text class="s mid" x="731" y="493">link HMAC, insert</text>

  <!-- 11: response -->
  <line class="ret" x1="408" y1="538" x2="72" y2="538" marker-end="url(#ah-ok)"/>
  <circle class="num" cx="84" cy="527" r="9"/><text class="numt" x="84" y="530.5">11</text>
  <text x="100" y="531">202 {"orderId": ...}</text>

  <!-- failures -->
  <line class="sep" x1="12" y1="570" x2="788" y2="570"/>
  <rect class="bg" x="252" y="562" width="296" height="16"/>
  <text class="m s mid" x="400" y="574">Instead of 10 and 11, when a check in 5 to 10 fails</text>
  <line class="err" x1="408" y1="604" x2="72" y2="604" marker-end="url(#ah-err)"/>
  <text x="84" y="597">ErrorHandling: application/problem+json</text>
  <text class="m s" x="84" y="620">400 403 409 415 429 500, no exception details</text>
  <line class="aud" x1="408" y1="644" x2="733" y2="644" marker-end="url(#ah-aud)"/>
  <text class="audit s" x="420" y="637">REQUEST_REJECTED, AUTHZ_DENIED, REQUEST_FAILED</text>

  <!-- legend -->
  <line class="ok" x1="14" y1="671" x2="44" y2="671" marker-end="url(#ah-ok)"/>
  <text class="m s" x="50" y="674">request, response</text>
  <line class="err" x1="170" y1="671" x2="200" y2="671" marker-end="url(#ah-err)"/>
  <text class="m s" x="206" y="674">failure answer</text>
  <line class="aud" x1="316" y1="671" x2="346" y2="671" marker-end="url(#ah-aud)"/>
  <text class="m s" x="352" y="674">audit record</text>
</svg>
