# No URLs or secrets here. In production they come from the environment:
#   QUARKUS_OIDC_AUTH_SERVER_URL, QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME,
#   QUARKUS_DATASOURCE_PASSWORD, AUDIT_HMAC_KEY
# In dev mode and tests, Dev Services start Keycloak and PostgreSQL because nothing is configured.

# Camel
camel.context.name = secure-partner-gateway
# Camel refuses to start with insecure Camel settings
%prod.camel.main.profile = prod

# HTTP: the API is on port 8080, health and metrics stay on the management port 9876
quarkus.http.limits.max-body-size = 64K
quarkus.http.header."X-Content-Type-Options".value = nosniff
quarkus.management.enabled = true
quarkus.management.port = 9876
quarkus.smallrye-health.root-path = /observe/health
quarkus.micrometer.export.prometheus.path = /observe/metrics

# Authentication: bearer tokens only, verified locally (signature, issuer, audience, expiry)
quarkus.oidc.application-type = service
quarkus.oidc.token.audience = gateway-api
quarkus.oidc.token.allow-jwt-introspection = false
quarkus.oidc.token.allow-opaque-token-introspection = false
# Authenticate every request before it is routed (the default, kept explicit)
quarkus.http.auth.proactive = true
# Some token verification warnings contain the rejected token. Failures are in the audit trail (AUTHN_FAILED).
%prod.quarkus.log.category."io.quarkus.oidc.runtime.OidcProvider".level = ERROR

# Authorization: deny everything, then allow single paths and methods to a role.
# The most specific path wins; on that path, a method that is not listed is denied.
quarkus.http.auth.permission.deny-all.paths = /*
quarkus.http.auth.permission.deny-all.policy = deny
quarkus.http.auth.policy.partner.roles-allowed = partner
quarkus.http.auth.policy.auditor.roles-allowed = auditor
quarkus.http.auth.permission.order-create.paths = /api/orders
quarkus.http.auth.permission.order-create.methods = POST
quarkus.http.auth.permission.order-create.policy = partner
quarkus.http.auth.permission.order-read.paths = /api/orders/*
quarkus.http.auth.permission.order-read.methods = GET
quarkus.http.auth.permission.order-read.policy = partner
quarkus.http.auth.permission.audit.paths = /api/audit,/api/audit/verify
quarkus.http.auth.permission.audit.methods = GET
quarkus.http.auth.permission.audit.policy = auditor
# Dev mode only: keep the Dev UI reachable
%dev.quarkus.http.auth.permission.dev-ui.paths = /q/dev-ui,/q/dev-ui/*
%dev.quarkus.http.auth.permission.dev-ui.policy = permit

# Database: Flyway creates the schema, including the append-only trigger. Hibernate only validates it.
quarkus.datasource.db-kind = postgresql
quarkus.flyway.migrate-at-start = true
quarkus.hibernate-orm.schema-management.strategy = validate
# Our entities and the one of the JPA idempotent repository, not the other Camel JPA entities
quarkus.hibernate-orm.packages = org.acme.partner.gateway.audit,org.acme.partner.gateway.order,org.apache.camel.processor.idempotent.jpa

# Order intake limit, per partner (GATEWAY_THROTTLE_MAX_REQUESTS, GATEWAY_THROTTLE_PERIOD)
gateway.throttle.max-requests = 10
gateway.throttle.period = 1s
# A long period makes the rate limit test deterministic
%test.gateway.throttle.max-requests = 100
%test.gateway.throttle.period = 60s

# Audit trail. The HMAC key has no production default (AUDIT_HMAC_KEY), so a missing key stops the startup.
%dev.audit.hmac-key = dev-only-audit-hmac-key-never-use-in-production
%test.audit.hmac-key = test-only-audit-hmac-key-never-use-in-production
audit.anchor-period = 5m

# Logging: JSON with MDC (partnerId, camel.exchangeId) outside dev and test
quarkus.camel.mdc.enabled = true
quarkus.camel.mdc.custom-exchange-properties = partnerId
%dev.quarkus.log.console.json.enabled = false
%test.quarkus.log.console.json.enabled = false

# Native image
quarkus.native.resources.includes = schema/*.json

# Dev Services: Keycloak with the test realm (outside of the classpath, so it is never packaged)
quarkus.keycloak.devservices.realm-path = config/gateway-realm.json
%dev.quarkus.keycloak.devservices.port = 8082

# Tests of the packaged application run with the test profile, for the HMAC key and the throttle settings
quarkus.test.integration-test-profile = test
