quarkus.banner.enabled=false
# The port used in dev mode, next to the orchestrator (8080) and the specialist agents (8081 and 8082)
%dev.quarkus.http.port=8083

# The chat model of the customer support agent: OpenAI or any OpenAI compatible API, like for the other applications.
# The API key comes from the OPENAI_API_KEY environment variable, so the secret never ends up in a packaged artifact.
support-desk.llm.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
support-desk.llm.model=${OPENAI_MODEL:gpt-5-mini}
support-desk.llm.api-key=${OPENAI_API_KEY}

# The carrier and payment provider APIs. The defaults point at the stand-ins served by this application.
support-desk.carrier.url=http://localhost:${quarkus.http.port}/fake/carrier
support-desk.payment.url=http://localhost:${quarkus.http.port}/fake/payments

# PostgreSQL holds the orders, returns, tickets and the tool audit. In dev and test mode, Dev Services start it and
# create the demo data. Otherwise set QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and
# QUARKUS_DATASOURCE_PASSWORD, and create the tables with db/support-desk.sql.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.init-script-path=db/support-desk.sql

# Kafka carries approved returns to the refund route and escalated tickets to the support team. In dev and test
# mode, Dev Services start it. Otherwise set KAFKA_BOOTSTRAP_SERVERS.
camel.component.kafka.brokers=${kafka.bootstrap.servers}

# The MCP server for the support staff publishes the ai-tool routes tagged "support" at /mcp
quarkus.camel.mcp-server.tags=support
quarkus.mcp.server.server-info.name=support-desk

# HTTP basic authentication with demo users, for trying the example only. Use a real identity provider, such as
# OpenID Connect, in production. The verified role is meant for the return policy described in the README.
quarkus.http.auth.basic=true
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.alice=alice
quarkus.security.users.embedded.roles.alice=customer,verified
quarkus.security.users.embedded.users.bob=bob
quarkus.security.users.embedded.roles.bob=customer
quarkus.security.users.embedded.users.carol=carol
quarkus.security.users.embedded.roles.carol=support
# Only the support staff may use the MCP server
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=support-staff
quarkus.http.auth.policy.support-staff.roles-allowed=support

# The prompt, the tool schema and the SQL statements are loaded from the classpath, so they must be embedded into the
# native executable
quarkus.native.resources.includes=prompts/*.txt,schemas/*.json,sql/*.sql
